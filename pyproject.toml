[project]
name = "aquaworld_ia"
authors = [
    { name = "Wassim Koubaa", email = "koubaawassim@gmail.com"}
]
description = "Manuels multilingues et design d'emballage par IA (OpenAI)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
# Installées au build de l'image de prod (comme pour les autres apps custom). Pillow, pypdf et
# requests arrivent avec frappe : on ne les redéclare pas.
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "openai~=2.15",          # chat JSON + images.edit / images.generate (gpt-image-1)
    "pymupdf~=1.28",         # extraction, réécriture en place (insert_htmlbox, RTL), composition à l'échelle
    "python-barcode~=0.15",  # EAN-13 en SVG (pur Python)
    "segno~=1.6",            # QR en SVG (pur Python, sans dépendance)
    "opencv-python-headless~=4.10",  # détourage propre des photos et logos (composantes connexes) ; repli pixel par pixel sans lui
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
