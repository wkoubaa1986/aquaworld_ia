# Tests de l'app — fonctions pures, sans site ni MariaDB ni bench : `frappe` est installé comme
# simple paquet Python et les tests n'importent que les modules de l'app. Les quelques tests qui
# rendent un PDF (PyMuPDF, wkhtmltopdf) tournent aussi : les deux sont installés ici.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install wkhtmltopdf (AI page layouts are rendered with it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wkhtmltopdf

      - name: Install frappe (as a library) and the app
        run: |
          pip install --quiet "git+https://github.com/frappe/frappe.git@version-15"
          pip install --quiet -e .

      # Hors bench, frappe.logger() écrit dans ../logs/frappe.log (relatif au workspace).
      - name: Create the logs dir frappe's fallback logger expects
        run: mkdir -p "$(dirname "$GITHUB_WORKSPACE")/logs"

      - name: Run the test suite
        run: python -m unittest discover -s aquaworld_ia/tests -t . -v 2>&1 | tail -30

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # La config ruff vit dans pyproject.toml. Non bloquant.
      - run: pip install --quiet ruff && ruff check . || true
